# Vérifications à chaque push et pull request : lint, types, tests unitaires, build de production.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PRICE_PROVIDER: mock
      - run: npx playwright install --with-deps chromium
      - name: Scénario de fumée dans Chromium (bureau, mobile, lien partagé, gestes)
        env:
          PRICE_PROVIDER: mock
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 2; done
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-e2e
          path: e2e/out
